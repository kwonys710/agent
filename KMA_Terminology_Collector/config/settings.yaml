# 사이트별 값은 반드시 `--mode inspect` 결과(reports/inspect_report.json)로 확인한 뒤 채운다.
# null 로 남은 필수 값이 있으면 sample/full/resume 은 실행을 거부한다(추측 금지).

site:
  base_url: "https://term.kma.org"
  list_path: "/search/list.asp"
  user_agent: "KMA-Terminology-Collector/0.1 (research use)"
  respect_robots_txt: true

# ↓ 2026-11-05 국내 PC 브라우저에서 실제 관찰한 값 (근거: docs/REPORT.md §2)
# robots.txt = "User-Agent: * / Disallow: /" → sample/full/resume 은 check_robots 에서 중단된다.
# 브라우저로 직접 저장한 페이지는 --mode import --html-dir 로 변환한다.
pagination:
  method: "GET"           # 페이지 링크: ./list.asp?pageno=N&sch_txt=..&sch_type1=..&sch_type2=..
  page_param: "pageno"
  fixed_params:           # 6.1판 = $.sch_type(7) → twdContent7/twdDong7. 검색어 없이 전체 조회 불가("총 0 개").
    sch_txt: "a"
    sch_type1: "twdContent7"
    sch_type2: "twdDong7"
    # A–Z 색인(앞글자 일치)으로 받으려면 아래 두 줄을 켠다. 사이트 자체 페이지 링크는 이 값을
    # 빠뜨려 2페이지부터 부분 일치(38,793건)로 바뀐다 — 여기서 매 요청에 고정으로 보낸다.
    # spelling_chk: "1"
    # sch_type_chk: "7"
  page_size: 15
  start_page: 1

parser:
  layout: "dl"            # 결과는 표가 아니라 <dl class="searchList"><dt>영문</dt><dd>한글</dd>
  row_selector: "dl.searchList"   # layout=dl 이면 dl 선택자, layout=table 이면 행(tr) 선택자
  # layout=table 일 때만 사용: 출력 컬럼 → 헤더 텍스트 정규식.
  header_map:
    english_term: null
    korean_term: null
    korean_alternative: null
    english_synonym: null
    abbreviation: null
    category: null
    notes: null
  detail_link_selector: "a[href]"
  term_id_query_param: null   # 사이트에 상세 링크·용어 ID 없음 → 내용 해시 ID(h_)
  total_count_regex: "총\\s*([\\d,]+)\\s*개"   # 관찰 문구: "총 38793 개의 단어가 검색되었습니다."
  # 정규식. 관찰된 구분: "배,복부" / "새끼벌림근, 소지외전근" / 다의어 "1. 유산  2. 낙태".
  # 분리본은 복수대응어 시트에만 쓰고 korean_term 은 원문 그대로 둔다.
  variant_separator: ",|\\s{2,}(?=\\d+\\.\\s)"
  edition_label: "6.1판"      # 사이트에 "6판" 메뉴 없음. 6.1판/5판 개정/5판/4판 중 6.1판 선택

throttle:
  concurrency: 1          # 코드는 순차 요청만 한다
  delay_min_sec: 3
  delay_max_sec: 5
  max_retries_5xx: 3
  backoff_base_sec: 5
  stop_status: [403, 429]
  timeout_sec: 30

paths:
  raw_dir: "data/raw"
  state_db: "data/processed/state.sqlite"
  output_dir: "data/output"
  log_dir: "logs"
  report_dir: "reports"
