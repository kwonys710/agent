<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>릴스</title></head>
<body>
  <nav aria-label="기본"><a role="link" href="/"><svg aria-label="홈"></svg></a></nav>
  <main>
    <article>
      <header><a role="link" href="/office_daily_kim/">office_daily_kim</a></header>
      <h1>퇴근 후 카페에서 마무리 #직장인</h1>
      <section>
        <span id="like" role="button"><svg aria-label="좋아요" width="24" height="24"></svg></span>
      </section>
      <form id="comment-form">
        <textarea aria-label="댓글 달기..."></textarea>
        <div role="button" id="submit">게시</div>
      </form>
      <!-- 입력란만 비우고 댓글은 끝까지 보여주지 않는다(UNKNOWN_STATE 재현용) -->
      <ul id="comments" role="list" aria-label="댓글"></ul>
    </article>
  </main>
  <script>
    const box = document.querySelector('#comment-form textarea');
    document.getElementById('submit').addEventListener('click', () => {
      const clicks = Number(sessionStorage.getItem('reel_submit_clicks') || '0') + 1;
      sessionStorage.setItem('reel_submit_clicks', String(clicks));
      box.value = '';
    });
  </script>
</body></html>
