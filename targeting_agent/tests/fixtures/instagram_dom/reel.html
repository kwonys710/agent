<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>릴스</title></head>
<body>
  <nav aria-label="기본"><a role="link" href="/"><svg aria-label="홈"></svg></a></nav>
  <main>
    <article>
      <header><a role="link" href="/office_daily_kim/">office_daily_kim</a></header>
      <h1>퇴근 후 카페에서 마무리 #직장인 #퇴근후 #카페</h1>
      <section>
        <span id="like" role="button"><svg aria-label="좋아요" width="24" height="24"></svg></span>
      </section>
      <form id="comment-form">
        <textarea aria-label="댓글 달기..."></textarea>
        <div role="button" id="submit">게시</div>
      </form>
      <ul id="comments" role="list" aria-label="댓글"></ul>
    </article>
  </main>
  <script>
    const like = document.getElementById('like');
    like.addEventListener('click', () => {
      const icon = like.querySelector('svg');
      const liked = icon.getAttribute('aria-label') === '좋아요 취소';
      icon.setAttribute('aria-label', liked ? '좋아요' : '좋아요 취소');
    });
    const form = document.getElementById('comment-form');
    const box = form.querySelector('textarea');
    const list = document.getElementById('comments');
    // 정적 페이지는 reload하면 상태가 사라지므로, 게시한 댓글과 게시 클릭 수를
    // sessionStorage에 남겨 두고 load마다 다시 그린다(영속성 확인 테스트용).
    const STORE = 'reel_comments';
    const CLICKS = 'reel_submit_clicks';
    function saved() {
      try { return JSON.parse(sessionStorage.getItem(STORE) || '[]'); } catch (e) { return []; }
    }
    function render() {
      list.textContent = '';
      for (const text of saved()) {
        const li = document.createElement('li');
        li.setAttribute('role', 'listitem');
        li.textContent = text;
        list.appendChild(li);
      }
    }
    render();
    document.getElementById('submit').addEventListener('click', () => {
      const clicks = Number(sessionStorage.getItem(CLICKS) || '0') + 1;
      sessionStorage.setItem(CLICKS, String(clicks));
      if (!box.value.trim()) return;
      const all = saved();
      all.push(box.value);
      sessionStorage.setItem(STORE, JSON.stringify(all));
      box.value = '';
      render();
    });
  </script>
</body></html>
