# DailyReels Targeting Agent 설정
# 모든 운영 값은 여기서 관리한다. API Key/Token은 여기 두지 말고 .env에 둘 것.

project:
  name: "DailyReels Targeting Agent"
  version: "0.1.0"

paths:
  data_dir: "data"
  database: "data/targeting.db"
  log_dir: "data/logs"
  export_dir: "data/exports"
  cache_dir: "data/cache"

profile:
  # DailyReels Target Profile (코드에 고정하지 않고 파일/DB에서 읽는다)
  path: "profiles/dailyreels.yaml"

instagram:
  account_type: "creator"

executor:
  mode: "manual"            # manual | official_api | browser
  stop_on_challenge: true
  stop_on_rate_limit: true
  stop_on_login_required: true

discovery:
  enabled: true
  default_source: "import"  # import(CSV/URL) | hashtag(공식 API 권한 필요)
  import:
    path: "samples/candidates_sample.csv"
  inbox:
    # 실행 시 data/inbox/*.csv 를 자동으로 읽어 후보로 등록한다(Phase 12A).
    # 원본 파일은 삭제하지 않고 processed/ 또는 failed/ 로 옮긴다.
    enabled: true
    path: "data/inbox"
    processed_dir: "data/inbox/processed"
    failed_dir: "data/inbox/failed"
  hashtag:
    # 공식 Graph API Hashtag Search 사용(IG_ACCESS_TOKEN / IG_BUSINESS_ACCOUNT_ID 필요)
    edge: "recent_media"      # recent_media(최근 24시간) | top_media
    per_hashtag_limit: 25
    max_hashtags_per_run: 5   # 7일 고유 해시태그 30개 한도를 나눠 쓰기 위한 실행당 제한
  hashtags:
    - 직장인
    - 직장인브이로그
    - 회사원
    - 출근
    - 퇴근
    - 퇴근후
    - 데일리
    - 일상브이로그
    - 직장인일상
    - 맛집
    - 카페
    - 주말
    - 주말일상
  languages:
    - ko
  content_types:
    - REEL
  max_candidates_per_run: 200
  creator:
    min_followers: 100
    max_followers: 30000

ai:
  # AI Intelligence Engine은 로컬에 설치·로그인된 Claude Code CLI를 사용한다.
  # 별도의 LLM API Key를 쓰지 않으며, OpenAI/Gemini/Anthropic SDK도 호출하지 않는다.
  provider: "claude_code"       # claude_code | heuristic
  model: "sonnet"
  prompt_version: "1.0"
  prompt_path: "prompts/targeting_analysis_v1.md"
  max_turns: 1
  timeout_seconds: 120
  use_cache: true
  fallback_to_heuristic: true
  daily_request_limit: 20       # 하루 Claude 호출 상한
  max_candidates_per_run: 10    # 한 번 실행에서 Claude에 보낼 후보 수 상한
  prefilter_min_score: 60       # heuristic 점수가 이 값 미만이면 Claude를 부르지 않는다

analysis:
  analyzer_version: "1"
  prompt_version: "1"
  use_caption: true
  use_hashtags: true
  use_creator_profile: true
  use_visual_analysis: false    # v0.1은 영상 다운로드/시각분석을 하지 않는다
  max_media_per_run: 100

scoring:
  minimum_target_score: 70
  auto_action_score: 82
  weights:
    content_similarity: 0.35
    creator_fit: 0.20
    activity: 0.15
    engagement: 0.15
    language_region: 0.10
    novelty: 0.05

comments:
  enabled: true
  language: "ko"
  min_length: 5
  max_length: 60
  candidates_per_post: 3
  max_generation_attempts: 4
  allow_emoji: true
  max_emoji: 1
  avoid_generic_comments: true
  require_context_keyword: true
  banned_phrases:
    - "잘 보고 갑니다"
    - "좋은 영상이네요"
    - "영상 잘 봤어요"
    - "맞팔"
    - "소통해요"
  duplicate_similarity_threshold: 0.86
  duplicate_compare_limit: 300

actions:
  enable_like: true
  enable_comment: true
  require_score_for_like: 75
  require_score_for_comment: 82
  daily_limits:
    likes: 20
    comments: 8
    timezone_offset_hours: 9
  per_creator:
    max_actions_per_day: 1
    cooldown_days: 7
    count_mode: "media"   # media: 같은 게시물 LIKE+COMMENT를 1건으로 집계 | action: 각각 1건
  execution:
    max_actions_per_run: 10
    stop_if_error_count: 3
    dry_run: true

safety:
  skip_private_accounts: true
  skip_ads: true
  skip_sensitive_content: true
  skip_if_already_interacted: true
  # 해시태그 검색 결과에는 username이 없어 Creator 한도를 적용할 수 없다.
  # true면 Creator 미확인 후보는 Action을 만들지 않고 운영자 확인 대상으로만 남긴다.
  skip_unresolved_creator: true
  block_duplicate_comments: true
  halt_on_platform_warning: true

learning:
  enabled: true
  track:
    - selected
    - skipped
    - liked
    - commented
    - responded
    - followed_after_interaction
  profile_update_interval_days: 7
  # 학습 결과는 config.yaml이 아니라 DB(app_state)에 override로 저장된다.
  # --learn 으로 제안 확인, --learn-apply 로 반영, --learn-reset 으로 초기화.
  min_feedback_samples: 10      # 이 수 미만이면 아무 것도 바꾸지 않는다
  min_keyword_occurrences: 3    # 키워드가 최소 몇 건의 Feedback에 등장해야 하는지
  min_keyword_media: 2          # 서로 다른 게시물 몇 개에서 반복돼야 하는지

  # Topic Weight 학습(Phase 17) — 결정론적 계산, Claude를 호출하지 않는다.
  minimum_feedback_count: 10    # 이 수 미만이면 Profile을 변경하지 않는다
  minimum_topic_samples: 3      # topic별 최소 신호 수
  max_delta_per_learning_run: 0.05   # 1회 학습에서 허용하는 최대 변화량
  min_topic_weight: 0.5
  max_topic_weight: 1.5
  signals:                      # 신호 강도(양수=positive, 음수=negative)
    GOOD_TARGET: 1.0
    RESPONDED: 1.0
    FOLLOWED: 1.0
    NOT_MY_STYLE: -1.2
    BAD_TARGET: -1.0
    APPROVED: 0.5
    SKIPPED: -0.3
  health:                       # 운영 경고 기준(보고만 하고 설정을 바꾸지 않는다)
    minimum_samples: 10
    fallback_rate_warning: 0.30
    candidate_error_warning: 0.10
    cache_hit_minimum_warning: 0.20
  threshold:
    minimum_band_samples: 5     # Score 구간 추천에 필요한 최소 표본
  min_keyword_score: 2.0        # 키워드 신호 강도 임계값

browser_discovery:
  # Phase 18A — Instagram 웹 화면에서 Reel 후보를 찾는다(읽기 전용).
  # 브라우저는 페이지 열기 / 검색 / 스크롤 / 게시물 열기 / 공개 텍스트 읽기만 한다.
  # 좋아요·댓글·팔로우·DM·저장·공유 등 쓰기 동작은 구현하지 않는다.
  # 로그인은 운영자가 run_instagram_session.bat 에서 **직접** 한다(ID/PW를 저장하지 않는다).
  # Scheduler와 자동 연결하지 않는다 — 운영자가 --discover 로 실행할 때만 동작한다.
  enabled: false
  headless: false          # 로그인/Challenge를 사람이 볼 수 있어야 하므로 기본 false
  profile_dir: "data/browser_profile"   # 운영자 로그인 세션(git에 올리지 않는다)
  timeout_ms: 20000
  scroll_rounds: 3
  media_types: ["REEL"]
  queries: []              # 비우면 discovery.hashtags 를 검색어로 재사용한다
  limits:
    # 플랫폼 제한 우회가 아니라, 운영자가 스스로 거는 보수적 내부 상한이다.
    max_queries_per_run: 5
    max_candidates_per_query: 10
    max_candidates_per_run: 40
    max_analyze_per_run: 20
  stop_on:
    # 아래 상태가 감지되면 즉시 중단한다. 자동으로 풀지 않는다.
    login_required: true
    challenge: true
    platform_warning: true
  lock:
    enabled: true
    path: "data/.browser_discovery.lock"
    stale_minutes: 30
  debug:
    # selector 실패 등 예외 상황에서만 스크린샷을 남긴다(전체 HTML dump 금지).
    enabled: true
    dir: "data/browser_debug"
    max_screenshots: 10

scheduler:
  # Windows Task Scheduler가 하루 1회 실행하는 배치 모드(python -m targeting_agent.main --scheduled).
  # Scheduled Run은 후보 수집·분석과 요약까지만 하고, Instagram Action은 실행하지 않는다.
  enabled: true
  process_inbox: true
  process_new_candidates: true
  max_candidates_per_run: 10
  lock:
    enabled: true
    path: "data/.scheduler.lock"
    stale_minutes: 60
  summary:
    enabled: true
    output_dir: "data/reports"
    keep_days: 30

dashboard:
  enabled: true
  # 127.0.0.1 / localhost 외의 값을 넣으면 실행을 거부한다(외부 노출 방지).
  host: "127.0.0.1"
  port: 8501

logging:
  level: "INFO"
  keep_days: 30
